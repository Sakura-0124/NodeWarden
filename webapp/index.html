<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    connect-src 'self' https://api.pwnedpasswords.com;
    font-src 'self';
    form-action 'self';
    base-uri 'self';
  " />

    <link rel="icon" type="image/svg+xml" href="/nodewarden-logo-bg.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- MiSans (Xiaomi HyperOS) — self-hosted, subsetted woff2 -->
    <link rel="stylesheet" href="/fonts/misans.css" />

    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NodeWarden" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>NodeWarden</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #ffffff;
        color: #000000;
        font-family: 'MiSans', 'Mi Sans', 'PingFang SC', 'Microsoft YaHei UI', 'Microsoft YaHei',
          'Noto Sans CJK SC', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial,
          sans-serif;
      }

      .boot-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      .boot-card {
        width: min(420px, 100%);
        display: grid;
        gap: 14px;
        justify-items: center;
        padding: 28px;
        border: 1px solid #e0e0e0;
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      }

      .boot-logo {
        width: 74px;
        height: 58px;
        object-fit: contain;
      }

      .boot-line {
        width: 72%;
        height: 12px;
        border-radius: 999px;
        background: #eaf2ff;
        background-size: 180% 100%;
        animation: boot-shimmer 1.2s ease-in-out infinite;
      }

      .boot-line.short {
        width: 46%;
      }

      @keyframes boot-shimmer {
        0% { background-position: 180% 0; }
        100% { background-position: -180% 0; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen">
        <div class="boot-card" aria-label="Loading NodeWarden">
          <img class="boot-logo" src="/nodewarden-logo.svg" alt="" />
          <div class="boot-line"></div>
          <div class="boot-line short"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
